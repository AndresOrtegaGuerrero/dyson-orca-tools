[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "dyson_orca_tools"

[project]
name = "dyson_orca_tools"
dynamic = ["version", "description"]
authors = [
    {name = "Andres Ortega Guerrero", email = "andres.ortega-guerrero@empa.ch"},
    {name = "Gonçalo Catarina", email = "goncalo.catarina@empa.ch"}

]
readme = "README.md"
license = {file = 'LICENSE'}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "typer",
    "numpy",
]



[project.optional-dependencies]
cube = [
  "pyscf",
]
plot = [
  "matplotlib",
]
dev = [
  "bumpver==2023.1129",
  "pre-commit==3.6.0",
  "pytest",

]

[project.urls]
Homepage = "https://github.com/AndresOrtegaGuerrero/dyson-orca-tools"
Issues = "https://github.com/AndresOrtegaGuerrero/dyson-orca-tools/issues"

[project.scripts]
dyson_orca_tools = 'dyson_orca_tools.cli.main:app'

[tool.bumpver]
current_version = "v0.1.0"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}."
tag_message = "Release {new_version}."
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"src/dyson_orca_tools/version.py" = [
    '__version__ = "{pep440_version}"',
]
